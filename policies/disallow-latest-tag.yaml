apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: object.spec.containers.all(c, !c.image.endsWith(':latest'))
      message: "A tag :latest nao e permitida. Use tag imutavel ou digest."
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, !c.image.endsWith(':latest'))"
      message: "A tag :latest nao e permitida em initContainers. Use tag imutavel ou digest."
