alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 192Mi

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: grafana/grafana
    tag: "11.3.0"
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 768Mi
  grafana.ini:
    log:
      mode: console
      level: info
