alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 192Mi

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
  image:
    repository: grafana/grafana
    tag: "11.3.0"
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 768Mi
  grafana.ini:
    log:
      mode: console
      level: info
